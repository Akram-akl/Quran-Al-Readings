<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - القراءات (Akram-akl)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <link rel="icon" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png"> <!-- إضافة الأيقونة المفقودة -->
    <link rel="stylesheet" href="css/style.css?v=2.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="logo" class="app-logo">
                <h2>القرآن الكريم</h2>
                <button id="closeSidebarBtn" class="btn-icon mobile-only" title="إغلاق"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-content">
                <div class="form-group">
                    <label for="readingSelect">الرواية</label>
                    <select id="readingSelect" class="form-control" title="الرواية">
                        <option value="Hafs">حفص عن عاصم</option>
                        <option value="Warsh">ورش عن نافع</option>
                        <option value="Qaloun">قالون عن نافع</option>
                        <option value="Duri">الدوري عن أبي عمرو</option>
                        <option value="Susi">السوسي عن أبي عمرو</option>
                        <option value="Shubah">شعبة عن عاصم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="surahSelect">السورة</label>
                    <select id="surahSelect" class="form-control" title="السورة"></select>
                </div>
                <div class="form-group">
                    <label for="jozzSelect">الجزء</label>
                    <select id="jozzSelect" class="form-control" title="الجزء"></select>
                </div>
                <hr>
                <hr>
                <!-- إضافة زر وضع الاختبار -->
                <button id="testingModeBtn" class="btn btn-warning w-100 mt-2 mb-2" title="وضع الحفظ والاختبار">
                    <i class="fas fa-eye-slash"></i> وضع الاختبار
                </button>
                <button id="searchOpenBtn" class="btn btn-info w-100 mt-2 mb-2" title="البحث الشامل">
                    <i class="fas fa-search"></i> بحث في القراءات
                </button>
                <button id="downloadOpenBtn" class="btn btn-secondary w-100 mt-2" title="تحميل">
                    <i class="fas fa-download"></i> تحميل الصوت
                </button>
            </div>
            <div class="sidebar-footer">
                <button id="themeToggleBtn" class="btn-icon" title="مظهر"><i class="fas fa-moon"></i></button>
            </div>
        </aside>

        <main class="main-body">
            <header class="header">
                <button id="openSidebarBtn" class="btn-icon mobile-only" title="فتح"><i class="fas fa-bars"></i></button>
                <h1 id="currentSurahTitle">سورة الفاتحة</h1>
            </header>
            <div class="reading-container" id="readingArea"></div>
            <nav class="page-navigation">
                <button id="prevPageBtn" class="btn-nav" title="السابقة"><i class="fas fa-chevron-right"></i></button>
                <div class="page-indicator">
                    <input type="number" id="pageInput" value="1" min="1" max="604" title="صفحة"> من 604
                </div>
                <button id="nextPageBtn" class="btn-nav" title="التالية"><i class="fas fa-chevron-left"></i></button>
            </nav>
            <footer class="player-container">
                <div class="player-controls">
                    <button id="prevAyahBtn" class="btn-icon" title="سابق"><i class="fas fa-step-backward"></i></button>
                    <button id="playPauseBtn" class="btn-play-pause" title="تشغيل"><i class="fas fa-play"></i></button>
                    <button id="nextAyahBtn" class="btn-icon" title="لاحق"><i class="fas fa-step-forward"></i></button>
                    <button id="repeatBtn" class="btn-icon" title="تكرار"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-area">
                    <input type="range" id="audioSeek" value="0" step="0.1" title="تقدم">
                </div>
            </footer>
        </main>
    </div>

    <!-- Modals -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <span class="close-modal"><i class="fas fa-times"></i></span>
            <h2>بحث في جميع القراءات</h2>
            <div class="form-group">
                <input type="text" id="searchInput" class="form-control" placeholder="ابحث بكلمة من القرآن...">
            </div>
            <button id="searchBtn" class="btn btn-primary w-100"><i class="fas fa-search"></i> بحث</button>
            <div id="searchResults" class="search-results-area"></div>
        </div>
    </div>

    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <span class="close-modal"><i class="fas fa-times"></i></span>
            <h2>تحميل الصوتيات</h2>
            <div class="form-group">
                <label>نطاق التحميل</label>
                <div class="input-row">
                    <input type="number" id="dlFromSurah" class="form-control" placeholder="سورة من">
                    <input type="number" id="dlFromAyah" class="form-control" placeholder="آية">
                </div>
                <div class="input-row mt-10">
                    <input type="number" id="dlToSurah" class="form-control" placeholder="سورة إلى">
                    <input type="number" id="dlToAyah" class="form-control" placeholder="آية">
                </div>
            </div>
            <button id="startDownloadBtn" class="btn btn-success w-100"><i class="fas fa-download"></i> بدء التحميل</button>
            <div id="downloadStatus" class="status-text"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js?v=2.4"></script>
    <script src="js/dataHandler.js?v=2.4"></script>
    <script src="js/audioPlayer.js?v=2.4"></script>
    <script src="js/search.js?v=2.4"></script>
    <script src="js/download.js?v=2.4"></script>
    <script src="js/ui.js?v=2.4"></script>
    <script src="js/app.js?v=2.4"></script>
</body>
</html>
