<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - القراءات</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <link rel="icon" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.png" alt="شعار" class="app-logo">
                <h2>القرآن الكريم</h2>
                <button id="closeSidebarBtn" class="btn-icon mobile-only"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="sidebar-content">
                <div class="form-group">
                    <label>الرواية</label>
                    <select id="readingSelect" class="form-control">
                        <option value="Hafs">حفص عن عاصم</option>
                        <option value="Warsh">ورش عن نافع</option>
                        <option value="Qaloun">قالون عن نافع</option>
                        <option value="Duri">الدوري عن أبي عمرو</option>
                        <option value="Susi">السوسي عن أبي عمرو</option>
                        <option value="Shubah">شعبة عن عاصم</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>السورة</label>
                    <select id="surahSelect" class="form-control"></select>
                </div>

                <div class="form-group">
                    <label>الجزء</label>
                    <select id="jozzSelect" class="form-control"></select>
                </div>

                <hr class="divider">

                <button id="searchOpenBtn" class="btn btn-accent w-100">
                    <i class="fas fa-search"></i> بحث في القراءات
                </button>

                <button id="downloadOpenBtn" class="btn btn-secondary w-100 mt-2">
                    <i class="fas fa-download"></i> تحميل الصوت
                </button>
            </div>

            <div class="sidebar-footer">
                <button id="themeToggleBtn" class="btn-icon"><i class="fas fa-moon"></i></button>
                <span>النسخة akram-akl</span>
            </div>
        </aside>

        <!-- Main Body -->
        <main class="main-body">
            <header class="header">
                <button id="openSidebarBtn" class="btn-icon mobile-only"><i class="fas fa-bars"></i></button>
                <div class="header-info">
                    <h1 id="currentSurahTitle">سورة الفاتحة</h1>
                </div>
            </header>

            <div class="reading-container" id="readingArea">
                <!-- Ayahs will be injected here -->
            </div>

            <nav class="page-navigation">
                <button id="prevPageBtn" class="btn-nav"><i class="fas fa-chevron-right"></i> الصفحة السابقة</button>
                <div class="page-indicator">
                    صفحة <input type="number" id="pageInput" value="1" min="1" max="604"> من 604
                </div>
                <button id="nextPageBtn" class="btn-nav">الصفحة التالية <i class="fas fa-chevron-left"></i></button>
            </nav>

            <footer class="player-container">
                <div class="player-info">
                    <span id="currentAyahInfo">آية 1</span>
                </div>
                <div class="player-controls">
                    <button id="prevAyahBtn" class="btn-icon"><i class="fas fa-step-backward"></i></button>
                    <button id="playPauseBtn" class="btn-play-pause"><i class="fas fa-play"></i></button>
                    <button id="nextAyahBtn" class="btn-icon"><i class="fas fa-step-forward"></i></button>
                    <button id="repeatBtn" class="btn-icon"><i class="fas fa-redo"></i></button>
                </div>
                <div class="progress-area">
                    <input type="range" id="audioSeek" value="0" step="0.1">
                </div>
            </footer>
        </main>
    </div>

    <!-- Modals -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>بحث متقدم</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <input type="text" id="searchInput" class="form-control col" placeholder="اكتب الكلمة أو الآية...">
                    <button id="searchBtn" class="btn btn-primary">بحث</button>
                </div>
                <div id="searchResults" class="search-results mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/dataHandler.js"></script>
    <script src="js/audioPlayer.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
